packages:
  - "package"
  - "attest-public"

blockExoticSubdeps: true

catalog:
  "@actions/attest": 3.2.0
  "@actions/core": 3.0.1
  "@codecov/vite-plugin": 2.0.1
  "@sigstore/bundle": 5.0.0
  "@sigstore/core": 4.0.1
  "@sigstore/tuf": 5.0.0
  "@sigstore/verify": 4.1.2
  "@types/node": 26.2.0
  "@vercel/ncc": 0.45.0
  "@vitest/coverage-istanbul": 4.1.11
  dedent: 1.7.2
  husky: 9.1.7
  markdownlint-cli2: 0.23.2
  oxfmt: 0.64.0
  oxlint: 1.79.0
  rollup-plugin-sbom: 4.0.0
  sigstore: 5.0.0

  typedoc: 0.28.20
  typedoc-theme-oxide: 0.3.0
  # @vercel/ncc@0.45.0 crashes with TypeScript 7; update when ncc supports it.
  typescript: 6.0.3
  undici: 8.10.0
  vite: 8.2.1
  vite-plugin-dts: 5.0.3
  vitest: 4.1.11
  zod: 4.4.3

minimumReleaseAge: 1440

minimumReleaseAgeExclude: []

onlyBuiltDependencies: []

overrides: {}

# @sigstore/verify: export verifyCertificateChain and verifyTLogInclusion
# for direct Rekor entry verification without reconstructing a full Bundle.
# Track upstream: https://github.com/sigstore/sigstore-js/issues/XXX
#
# undici: remove AsyncResource from RequestHandler to prevent leaked
# async_hooks handles in tests. Safe for Promise-based await request()
# usage (Promise continuations preserve async context). Breaks
# AsyncLocalStorage propagation in callback-style undici APIs —
# not used by this project. Also exports MockInterceptor type.
# Re-evaluate on undici upgrades.
patchedDependencies:
  "@sigstore/verify@4.1.2": patches/@sigstore__verify@4.1.2.patch
  tuf-js@6.0.0: patches/tuf-js@6.0.0.patch
  undici@8.10.0: patches/undici@8.10.0.patch

strictDepBuilds: true
