name: "Publish attested native addon"
on:
  workflow_call:
    inputs:
      addons-artifact-pattern:
        description: >-
          Glob for `actions/download-artifact` (e.g. `slsa-addons-*`); each
          match holds one descriptor JSON from `attest-addon`.
        required: true
        type: string
      release-base-url:
        description: >-
          Trust anchor: every descriptor's `url` must start with this prefix.
          A tampered descriptor pointing at another host is rejected before
          any addon bytes are fetched.
        required: true
        type: string
      tarball-artifact:
        description: "Name of the GH artifact holding the pre-packed .tgz or .tar.gz."
        required: true
        type: string
      access:
        description: "npm publish --access (public|restricted)."
        required: false
        type: string
      tag:
        description: "npm dist-tag. Omit → latest."
        required: false
        type: string
      max-binary-bytes:
        description: "Per-binary size cap (bytes)."
        required: false
        default: 268435456
        type: number
      max-binary-seconds:
        description: "Per-binary fetch timeout (seconds)."
        required: false
        default: 300
        type: number
permissions: {}
jobs:
  publish:
    name: "Publish"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 20
    permissions:
      contents: "read"
      id-token: "write" # npm trusted publishing
    steps:
      - name: "Download pre-packed tarball"
        uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
        with:
          name: "${{ inputs.tarball-artifact }}"
          path: "./tarball"
      - name: "Set up Node.js + npm registry for trusted publishing"
        # Node 24 ships npm ≥ 11.5.1 (OIDC trusted-publishing minimum).
        # Avoids the in-place npm self-upgrade, which was flaky on Node 22.
        uses: "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: "Extract pre-packed tarball"
        id: "extract"
        shell: "bash"
        # Accepts `.tgz` (npm/pnpm) and `.tar.gz` (build-script convention)
        # so callers don't have to rename before upload.
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(./tarball/*.tgz ./tarball/*.tar.gz)
          if [[ ${#tarballs[@]} -ne 1 ]]; then
            echo "expected exactly one .tgz/.tar.gz in ./tarball; found ${#tarballs[@]}" >&2
            exit 1
          fi
          workdir="$RUNNER_TEMP/slsa-publish-$$"
          mkdir -p "$workdir"
          tar -xzf "${tarballs[0]}" -C "$workdir"
          echo "package-dir=$workdir/package" >>"$GITHUB_OUTPUT"
      - name: "Read package.json fields: name, manifest path, attest workflow"
        id: "pkg"
        shell: "bash"
        env:
          PACKAGE_DIR: "${{ steps.extract.outputs.package-dir }}"
        # `manifest` = embed location (mirrored by the install-time loader);
        # `attestWorkflow` = filename pinned into the Fulcio Build Signer URI.
        run: |
          set -euo pipefail
          pkg_json="$PACKAGE_DIR/package.json"
          name=$(jq -r '.name' "$pkg_json")
          manifest_rel=$(jq -r '.addon.manifest // empty' "$pkg_json")
          attest_workflow=$(jq -r '.addon.attestWorkflow // empty' "$pkg_json")
          missing=()
          [[ -z "$manifest_rel" ]] && missing+=(addon.manifest)
          [[ -z "$attest_workflow" ]] && missing+=(addon.attestWorkflow)
          if (( ${#missing[@]} > 0 )); then
            echo "package.json is missing required field(s): ${missing[*]}" >&2
            exit 1
          fi
          {
            echo "name=$name"
            echo "manifest-rel=$manifest_rel"
            echo "attest-workflow=$attest_workflow"
          } >>"$GITHUB_OUTPUT"
      - name: "Download per-binary descriptor artifacts"
        uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
        with:
          pattern: "${{ inputs.addons-artifact-pattern }}"
          path: "${{ runner.temp }}/slsa-descriptors"
          merge-multiple: true
      - name: "Slurp descriptor JSON files"
        id: "slurp"
        shell: "bash"
        env:
          DESCRIPTOR_DIR: "${{ runner.temp }}/slsa-descriptors"
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$DESCRIPTOR_DIR"/*.slsa.json)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no descriptor files found under $DESCRIPTOR_DIR" >&2
            exit 1
          fi
          {
            echo "descriptors<<__SLSA_EOF__"
            jq -s '.' "${files[@]}"
            echo "__SLSA_EOF__"
          } >>"$GITHUB_OUTPUT"
      - name: "Aggregate descriptors into addons JSON map"
        id: "aggregate"
        # See verify-addons step below for the cross-repo `uses:` rationale.
        uses: "vadimpiven/node-addon-slsa/.github/actions/aggregate-descriptors@94cd3546a72ca60b8550bf6e9903d0fcbaae153c" # v0.12.0
        with:
          descriptors: "${{ steps.slurp.outputs.descriptors }}"
          release-base-url: "${{ inputs.release-base-url }}"
      - name: "Verify addons (sigstore) and build SLSA manifest"
        id: "verify"
        # Cross-repo `uses:` — `workflow_ref`/`workflow_sha` resolve to the
        # caller in a `workflow_call`, so there's no context for the callee's
        # own ref. SHA-pinned (GHA org policy enforces full-SHA at runtime;
        # a commit cannot contain its own SHA, so bump in two commits when
        # the action changes).
        uses: "vadimpiven/node-addon-slsa/.github/actions/verify-addons@94cd3546a72ca60b8550bf6e9903d0fcbaae153c" # v0.12.0
        with:
          package-name: "${{ steps.pkg.outputs.name }}"
          addons: "${{ steps.aggregate.outputs.addons }}"
          attest-workflow: "${{ steps.pkg.outputs.attest-workflow }}"
          max-binary-bytes: "${{ inputs.max-binary-bytes }}"
          max-binary-seconds: "${{ inputs.max-binary-seconds }}"
      - name: "Embed SLSA manifest"
        shell: "bash"
        env:
          MANIFEST: "${{ steps.verify.outputs.manifest }}"
          MANIFEST_REL: "${{ steps.pkg.outputs.manifest-rel }}"
          PACKAGE_DIR: "${{ steps.extract.outputs.package-dir }}"
        # Block `addon.manifest: "../escape.json"` traversal (`realpath -m`
        # canonicalises a not-yet-existing path); refuse overwrite — the
        # pre-packed tarball must not already ship a manifest.
        run: |
          set -euo pipefail
          pkg_abs=$(realpath "$PACKAGE_DIR")
          manifest_abs=$(realpath -m "$pkg_abs/$MANIFEST_REL")
          case "$manifest_abs/" in
            "$pkg_abs"/*) ;;
            *) echo "addon.manifest escapes package dir: $MANIFEST_REL" >&2; exit 1 ;;
          esac
          if [[ -e "$manifest_abs" ]]; then
            echo "refusing to overwrite existing $manifest_abs" >&2
            exit 1
          fi
          mkdir -p "$(dirname "$manifest_abs")"
          printf '%s\n' "$MANIFEST" > "$manifest_abs"
      - name: "Repack tarball deterministically"
        id: "repack"
        shell: "bash"
        env:
          PACKAGE_DIR: "${{ steps.extract.outputs.package-dir }}"
        # Reproducibility, not security: `npm publish` re-hashes for
        # `dist.integrity`. Helps auditors reproduce the byte-identical tarball.
        run: |
          set -euo pipefail
          workdir=$(dirname "$PACKAGE_DIR")
          out="$workdir/package.tgz"
          tar \
            --format=ustar \
            --sort=name \
            --mtime=@1 \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "$out" \
            -C "$workdir" \
            package
          echo "tarball=$out" >>"$GITHUB_OUTPUT"
      - name: "npm publish (trusted publishing via OIDC)"
        shell: "bash"
        env:
          TARBALL: "${{ steps.repack.outputs.tarball }}"
          ACCESS: "${{ inputs.access }}"
          TAG: "${{ inputs.tag }}"
        run: |
          set -euo pipefail
          args=(publish "$TARBALL")
          [[ -n "$ACCESS" ]] && args+=(--access "$ACCESS")
          [[ -n "$TAG"    ]] && args+=(--tag    "$TAG")
          npm "${args[@]}"
