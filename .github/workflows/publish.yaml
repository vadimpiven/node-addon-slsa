name: "Publish attested native addon"
on:
  workflow_call:
    inputs:
      access:
        description: "npm publish --access (public|restricted). Default: public."
        required: false
        type: string
        default: "public"
      tag:
        description: "npm dist-tag. Omit → latest."
        required: false
        type: string
      release-base-url:
        description: >-
          Trust anchor: every descriptor's `url` must start with this prefix.
          Defaults to the GitHub Release for the current tag:
          `https://github.com/<repo>/releases/download/<ref-name>/`.
          Override for monorepos with per-package tag schemes or for
          packages distributed via a CDN.
        required: false
        type: string
        default: ""
permissions: {}
jobs:
  publish:
    name: "Publish"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 20
    permissions:
      contents: "read"
      id-token: "write" # npm trusted publishing
    steps:
      # Checkout the toolkit at the same SHA the consumer pinned this
      # reusable workflow to, so local-path composite actions below
      # resolve from a SHA-anchored, untrusted-input-free tree.
      # `github.job_workflow_sha` is the SHA of *this* reusable workflow
      # file in *this* repo (the callee); `github.workflow_sha` would be
      # the caller's workflow-file SHA, which lives in a different repo.
      - name: "Checkout toolkit"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
        with:
          repository: "vadimpiven/node-addon-slsa"
          ref: "${{ github.job_workflow_sha }}"
          path: "node-addon-slsa-toolkit"
          fetch-depth: 1
          persist-credentials: false
      # Must match the prefix `attest-addon.yaml` used when minting
      # bundles, otherwise `verify-addons` rejects every descriptor.
      - name: "Resolve effective release-base-url"
        id: "resolve-url"
        uses: "./node-addon-slsa-toolkit/.github/actions/resolve-release-base-url"
        with:
          release-base-url: "${{ inputs.release-base-url }}"
      - name: "Download pre-packed tarball"
        uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
        with:
          name: "slsa-tarball"
          path: "./tarball"
      # Node 24 ships npm ≥ 11.5.1 (OIDC trusted-publishing minimum) and
      # avoids the in-place npm self-upgrade that was flaky on Node 22.
      - name: "Set up Node.js + npm registry for trusted publishing"
        uses: "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      # Accepts `.tgz` (npm/pnpm) and `.tar.gz` (build-script convention).
      - name: "Extract pre-packed tarball"
        id: "extract"
        shell: "bash"
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(./tarball/*.tgz ./tarball/*.tar.gz)
          if [[ ${#tarballs[@]} -ne 1 ]]; then
            echo "expected exactly one .tgz/.tar.gz in ./tarball; found ${#tarballs[@]}" >&2
            exit 1
          fi
          workdir="$RUNNER_TEMP/slsa-publish-$$"
          mkdir -p "$workdir"
          tar -xzf "${tarballs[0]}" -C "$workdir"
          echo "package-dir=$workdir/package" >>"$GITHUB_OUTPUT"
      - name: "Read package.json fields: name, manifest path"
        id: "pkg"
        shell: "bash"
        env:
          PACKAGE_DIR: "${{ steps.extract.outputs.package-dir }}"
        run: |
          set -euo pipefail
          pkg_json="$PACKAGE_DIR/package.json"
          name=$(jq -r '.name' "$pkg_json")
          manifest_rel=$(jq -r '.addon.manifest // empty' "$pkg_json")
          if [[ -z "$manifest_rel" ]]; then
            echo "package.json is missing required field: addon.manifest" >&2
            exit 1
          fi
          {
            echo "name=$name"
            echo "manifest-rel=$manifest_rel"
          } >>"$GITHUB_OUTPUT"
      - name: "Download per-binary descriptor + bundle artifacts"
        uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
        with:
          pattern: "slsa-addons-*"
          path: "${{ runner.temp }}/slsa-descriptors"
          merge-multiple: true
      # SHA-pinned to this repo: a commit cannot contain its own SHA, so
      # bump in a follow-up commit when the action changes.
      - name: "Verify addons and build SLSA manifest"
        id: "verify"
        uses: "vadimpiven/node-addon-slsa/.github/actions/verify-addons@d2ab8076732befb3c5b966e202fd027b612267b6" # v0.13.0
        with:
          package-name: "${{ steps.pkg.outputs.name }}"
          descriptors-dir: "${{ runner.temp }}/slsa-descriptors"
          release-base-url: "${{ steps.resolve-url.outputs.release-base-url }}"
        env:
          # Lets the HEAD reachability check authenticate against private
          # release assets. The action only attaches it to github.com /
          # api.github.com; ignored otherwise.
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      # Block `addon.manifest: "../escape.json"` traversal and refuse to
      # overwrite — the pre-packed tarball must not already ship a manifest.
      - name: "Embed SLSA manifest"
        shell: "bash"
        env:
          MANIFEST: "${{ steps.verify.outputs.manifest }}"
          MANIFEST_REL: "${{ steps.pkg.outputs.manifest-rel }}"
          PACKAGE_DIR: "${{ steps.extract.outputs.package-dir }}"
        run: |
          set -euo pipefail
          pkg_abs=$(realpath "$PACKAGE_DIR")
          manifest_abs=$(realpath -m "$pkg_abs/$MANIFEST_REL")
          case "$manifest_abs/" in
            "$pkg_abs"/*) ;;
            *) echo "addon.manifest escapes package dir: $MANIFEST_REL" >&2; exit 1 ;;
          esac
          if [[ -e "$manifest_abs" ]]; then
            echo "refusing to overwrite existing $manifest_abs" >&2
            exit 1
          fi
          mkdir -p "$(dirname "$manifest_abs")"
          printf '%s\n' "$MANIFEST" > "$manifest_abs"
          echo "Embedded SLSA manifest: $manifest_abs"
      # Reproducibility for auditors, not security: `npm publish` re-hashes
      # for `dist.integrity`.
      - name: "Repack tarball deterministically"
        id: "repack"
        shell: "bash"
        env:
          PACKAGE_DIR: "${{ steps.extract.outputs.package-dir }}"
        run: |
          set -euo pipefail
          workdir=$(dirname "$PACKAGE_DIR")
          out="$workdir/package.tgz"
          echo "Repacking tarball deterministically..."
          tar \
            --format=ustar \
            --sort=name \
            --mtime=@1 \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "$out" \
            -C "$workdir" \
            package
          echo "✓ repacked: $out ($(stat -c%s "$out" 2>/dev/null || stat -f%z "$out") bytes)"
          echo "tarball=$out" >>"$GITHUB_OUTPUT"
      - name: "npm publish"
        shell: "bash"
        env:
          TARBALL: "${{ steps.repack.outputs.tarball }}"
          ACCESS: "${{ inputs.access }}"
          TAG: "${{ inputs.tag }}"
          PKG_NAME: "${{ steps.pkg.outputs.name }}"
          GH_REF_NAME: "${{ github.ref_name }}"
        run: |
          set -euo pipefail
          args=(publish "$TARBALL")
          [[ -n "$ACCESS" ]] && args+=(--access "$ACCESS")
          [[ -n "$TAG"    ]] && args+=(--tag    "$TAG")
          echo "Publishing $PKG_NAME (tag $GH_REF_NAME) to npmjs.org via trusted publishing..."
          if npm "${args[@]}"; then
            echo "✓ published $PKG_NAME"
          else
            status=$?
            echo "✗ npm publish failed (exit $status)" >&2
            exit "$status"
          fi
