name: "Build and test"
on:
  pull_request:
    types: ["opened", "reopened", "synchronize"]
    branches:
      - "main"
  push:
    branches:
      - "main"
  schedule:
    - cron: "32 4 * * *"
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  init:
    name: "Init"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 5
    permissions:
      contents: "read" # to fetch code
    outputs:
      cache-key: "${{ steps.init.outputs.cache-key }}"
      env: "${{ steps.init.outputs.env }}"
      test-coverage: "${{ steps.init.outputs.test-coverage }}"
      test-reports: "${{ steps.init.outputs.test-reports }}"
      mise-version: "${{ steps.init.outputs.mise-version }}"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          ref: "${{ github.ref }}"
          fetch-depth: 1
          persist-credentials: false
      - name: "Init"
        id: "init"
        uses: "./.github/actions/init-workflow"
  build-and-test:
    name: "Build and test"
    needs: "init"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 15
    permissions:
      contents: "read" # to fetch code
      id-token: "write" # for OIDC authentication
    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          ref: "${{ github.ref }}"
          fetch-depth: 1
          persist-credentials: false
      - name: "Setup"
        uses: "./.github/actions/setup"
        with:
          env: "${{ needs.init.outputs.env }}"
          cache-key: "${{ needs.init.outputs.cache-key }}"
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          mise-version: "${{ needs.init.outputs.mise-version }}"
      - name: "Build and test"
        run: "mise run --force ci-test"
      - name: "Upload reports"
        if: "!cancelled()"
        uses: "./.github/actions/upload-reports"
        with:
          test-coverage: "${{ needs.init.outputs.test-coverage }}"
          test-reports: "${{ needs.init.outputs.test-reports }}"
  zizmor:
    name: "Check CI scripts"
    timeout-minutes: 15
    permissions:
      contents: "read" # to fetch code
      security-events: "write" # to upload sarif results
    runs-on: "ubuntu-24.04"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          ref: "${{ github.ref }}"
          fetch-depth: 1
          persist-credentials: false
      - name: "Run zizmor"
        uses: "zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054" # v0.6.2
        with:
          persona: "auditor"
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
  trivy:
    name: "Security scan"
    timeout-minutes: 15
    permissions:
      contents: "read" # to fetch code
      security-events: "write" # to upload sarif results
    runs-on: "ubuntu-24.04"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          ref: "${{ github.ref }}"
          fetch-depth: 1
          persist-credentials: false
      - name: "Run Trivy vulnerability scanner"
        uses: "aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25" # v0.36.0
        with:
          trivy-config: "trivy.yaml"
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          ignore-unfixed: true
      - name: "Upload Trivy scan results to GitHub Security tab"
        uses: "github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd" # v4.37.7
        with:
          sarif_file: "trivy-results.sarif"
