name: "Upload Reports"
description: "Upload coverage and test reports to Codecov"
inputs:
  test-coverage:
    description: "Coverage report file path"
    required: true
  test-reports:
    description: "Test report file path"
    required: true
runs:
  using: "composite"
  steps:
    - name: "Upload coverage to Codecov"
      uses: "codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5" # v7.1.1
      with:
        use_oidc: true
        report_type: "coverage"
        files: "${{ inputs.test-coverage }}"
    - name: "Upload test results to Codecov"
      uses: "codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5" # v7.1.1
      with:
        use_oidc: true
        report_type: "test_results"
        files: "${{ inputs.test-reports }}"
