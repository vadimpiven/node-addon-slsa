name: "Aggregate addon descriptors"
description: >-
  Validate a JSON array of `*.slsa.json` descriptor objects against the
  trust anchor `release-base-url` and emit the nested `addons` JSON map
  consumed by `verify-addons`. Rejects zero descriptors, duplicate
  (platform, arch) pairs, and any `url`/`bundleUrl` that does not start
  with `release-base-url`.
inputs:
  descriptors:
    description: >-
      JSON array string of descriptor objects (typically built in the
      workflow with `jq -s '.' "$DIR"/*.slsa.json`).
    required: true
  release-base-url:
    description: >-
      Trust anchor: every descriptor's `url` and `bundleUrl` must start
      with this prefix. Must be `https://`; a trailing `/` is appended
      if missing.
    required: true
outputs:
  addons:
    description: >-
      JSON string: `{ [platform]: { [arch]: { url, bundleUrl } } }`.
runs:
  using: "node24"
  main: "dist/index.js"
