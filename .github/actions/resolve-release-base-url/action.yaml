name: "Resolve release-base-url"
description: >-
  Resolve the effective `release-base-url` for the current run. If the
  caller passed an explicit value, use it; otherwise fall back to the
  GitHub Release for the current tag:
  `https://github.com/<repo>/releases/download/<ref-name>/`. Shared by
  `attest-addon.yaml` (binary upload) and `publish.yaml` (verify) so the
  prefix the bundle was minted with matches the prefix the publisher
  validates against.
inputs:
  release-base-url:
    description: "Caller-supplied URL prefix; empty → derive default."
    required: false
    default: ""
outputs:
  release-base-url:
    description: "Resolved URL prefix (no normalization beyond what the caller supplied)."
    value: "${{ steps.resolve.outputs.url }}"
runs:
  using: "composite"
  steps:
    - name: "Resolve"
      id: "resolve"
      shell: "bash"
      env:
        INPUT_URL: "${{ inputs.release-base-url }}"
        GH_REPOSITORY: "${{ github.repository }}"
        GH_REF_NAME: "${{ github.ref_name }}"
      run: |
        set -euo pipefail
        if [[ -n "$INPUT_URL" ]]; then
          url="$INPUT_URL"
          echo "Resolved release-base-url (caller-supplied): $url"
        else
          url="https://github.com/${GH_REPOSITORY}/releases/download/${GH_REF_NAME}/"
          echo "Resolved release-base-url (default GitHub Release): $url"
        fi
        echo "url=$url" >>"$GITHUB_OUTPUT"
