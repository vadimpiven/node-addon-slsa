name: "Attest addon (public-good sigstore)"
description: >-
  Hash one downloaded `.node.gz`, mint a sigstore bundle on the
  public-good instance, and upload `slsa-addons-<platform>-<arch>` —
  a per-binary descriptor + bundle pair for the toolkit's `publish.yaml`
  to consume without re-fetching from the public URL. Invoked by the
  toolkit's `attest-addon.yaml` reusable workflow, one call per matrix
  cell. `platform`/`arch` are parsed from the binary filename suffix
  produced by `slsa pack` (`-<platform>-<arch>.node.gz`).
inputs:
  binary-path:
    description: "Filesystem path of the `.node.gz` binary to attest."
    required: true
  url-prefix:
    description: >-
      Public URL prefix the binary will be served at. Must be `https://`;
      a trailing `/` is appended if missing. `url = url-prefix + basename(binary)`.
    required: true
  github-token:
    description: "Sigstore OIDC token."
    default: "${{ github.token }}"
    required: false
  max-binary-bytes:
    description: "Per-binary size cap. Default 256 MiB."
    required: false
    default: "268435456"
  descriptor-retention-days:
    description: "Descriptor artifact retention. Default 14d."
    required: false
    default: "14"
outputs:
  binary-path:
    description: "Resolved binary path (echoed for the release-upload step)."
  bundle-path:
    description: "Path of the written `.sigstore` bundle (echoed for the release-upload step)."
runs:
  using: "node24"
  main: "dist/index.js"
